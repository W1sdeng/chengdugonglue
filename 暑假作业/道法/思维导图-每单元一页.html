<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道德与法治·八年级下册 思维导图（每单元一页）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:#eef1f5; color:#1a1a2e;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheets { padding: 0 0 24px; }

  /* ===== 每单元一页 ===== */
  .sheet {
    background:#fff;
    max-width:860px;
    margin:18px auto;
    padding:16px 20px 10px;
    box-shadow:0 1px 6px rgba(0,0,0,.12);
    border-top:4px solid var(--c);
  }
  .unit-bar {
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid var(--c); padding-bottom:8px; margin-bottom:12px;
  }
  .unit-title { font-size:21px; font-weight:800; letter-spacing:.05em; }
  .unit-title .badge { color:var(--c); margin-right:10px; }
  .page-no { font-size:12px; color:#888; white-space:nowrap; }
  .canvas-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; text-align:center; }
  .mindmap { display:block; margin:0 auto; }
  .foot {
    margin-top:12px; padding-top:8px; text-align:center;
    font-size:11px; color:#aab; letter-spacing:.22em; border-top:1px solid #eee;
  }

  @media print {
    body { background:#fff; }
    .sheets { padding:0; }
    .sheet {
      max-width:none; margin:0; padding:6mm 2mm 4mm;
      box-shadow:none; border-top:none;
      page-break-after:always;
    }
    .sheet:last-child { page-break-after:auto; }
    .canvas-wrap { overflow:visible; }
    .mindmap { width:100%; height:auto; }
  }
  @page { size:A4; margin:8mm; }
</style>
</head>
<body>
<div class="sheets">

  <!-- ============ 第一单元 ============ -->
  <section class="sheet" style="--c:#c0392b">
    <header class="unit-bar">
      <div class="unit-title"><span class="badge">第一单元</span>坚持宪法至上</div>
      <div class="page-no">第 1 页 / 共 5 页</div>
    </header>
    <div class="canvas-wrap"><svg id="mm0" class="mindmap"></svg></div>
    <footer class="foot">道德与法治 八下 · 思维导图</footer>
  </section>

  <!-- ============ 第二单元 ============ -->
  <section class="sheet" style="--c:#2e86c1">
    <header class="unit-bar">
      <div class="unit-title"><span class="badge">第二单元</span>理解权利义务</div>
      <div class="page-no">第 2 页 / 共 5 页</div>
    </header>
    <div class="canvas-wrap"><svg id="mm1" class="mindmap"></svg></div>
    <footer class="foot">道德与法治 八下 · 思维导图</footer>
  </section>

  <!-- ============ 第三单元 ============ -->
  <section class="sheet" style="--c:#1e8449">
    <header class="unit-bar">
      <div class="unit-title"><span class="badge">第三单元</span>认识国家制度</div>
      <div class="page-no">第 3 页 / 共 5 页</div>
    </header>
    <div class="canvas-wrap"><svg id="mm2" class="mindmap"></svg></div>
    <footer class="foot">道德与法治 八下 · 思维导图</footer>
  </section>

  <!-- ============ 第四单元 ============ -->
  <section class="sheet" style="--c:#884ea0">
    <header class="unit-bar">
      <div class="unit-title"><span class="badge">第四单元</span>走近国家机构</div>
      <div class="page-no">第 4 页 / 共 5 页</div>
    </header>
    <div class="canvas-wrap"><svg id="mm3" class="mindmap"></svg></div>
    <footer class="foot">道德与法治 八下 · 思维导图</footer>
  </section>

  <!-- ============ 第五单元 ============ -->
  <section class="sheet" style="--c:#d35400">
    <header class="unit-bar">
      <div class="unit-title"><span class="badge">第五单元</span>建设法治中国</div>
      <div class="page-no">第 5 页 / 共 5 页</div>
    </header>
    <div class="canvas-wrap"><svg id="mm4" class="mindmap"></svg></div>
    <footer class="foot">道德与法治 八下 · 思维导图</footer>
  </section>

</div>

<script>
/* ================= 内容数据（2026新版教材 五单元） ================= */
const UNITS = [
  { no:"第一单元", name:"坚持宪法至上", color:0, lessons:[
    { name:"第一课 治国安邦的总章程", boxes:[
      { name:"第1框 党领导人民制定宪法", points:[
        "宪法是根本法、治国安邦总章程","党的领导是最本质特征","一切权力属于人民" ]},
      { name:"第2框 组织国家机构·规范权力运行", points:[
        "人大产生国家机构，对其负责受其监督","根本政治制度：人民代表大会制度","运行原则：民主集中制" ]}
    ]},
    { name:"第二课 维护宪法权威", boxes:[
      { name:"第1框 坚持依宪治国", points:[
        "宪法效力最高，一切法律不得抵触","宪法是公民权利的保障书" ]},
      { name:"第2框 加强宪法监督", points:[
        "宪法监督保障宪法实施","学习宪法·认同宪法·践行宪法" ]}
    ]}
  ]},

  { no:"第二单元", name:"理解权利义务", color:1, lessons:[
    { name:"第三课 公民权利", boxes:[
      { name:"第1框 公民基本权利", points:[
        "政治权利和自由","人身自由不受侵犯","社会经济文化教育权利" ]},
      { name:"第2框 依法行使权利", points:[
        "维权途径：协商→调解→仲裁→诉讼","不得损害他人合法权益" ]}
    ]},
    { name:"第四课 公民义务", boxes:[
      { name:"第1框 公民基本义务", points:[
        "遵守宪法法律·维护国家统一","依法服兵役·依法纳税" ]},
      { name:"第2框 依法履行义务", points:[
        "权利义务相统一","违反义务须担责" ]}
    ]}
  ]},

  { no:"第三单元", name:"认识国家制度", color:2, lessons:[
    { name:"第五课 我国的政治制度", points:[
      "根本制度：人民代表大会制度","政协协商制度","民族区域自治制度","基层群众自治制度" ]},
    { name:"第六课 我国的基本经济制度", points:[
      "公有制为主体、多种所有制经济共同发展","按劳分配为主体、多种分配方式并存","社会主义市场经济体制" ]}
  ]},

  { no:"第四单元", name:"走近国家机构", color:3, lessons:[
    { name:"第七课 国家权力机关", points:[
      "全国人大＝最高权力机关","立法权·决定权·任免权·监督权" ]},
    { name:"第八课 中华人民共和国主席", points:[
      "由全国人大选举产生","公布法律·任免·外事·荣誉" ]},
    { name:"第九课 国家行政机关", points:[
      "国务院＝最高行政机关","依法行政" ]},
    { name:"第十课 中央军事委员会", points:[
      "最高军事领导机关" ]},
    { name:"第十一课 国家监察机关", points:[
      "监察公职人员","监督·调查·处置" ]},
    { name:"第十二课 国家司法机关", points:[
      "人民法院＝审判机关","人民检察院＝法律监督机关" ]}
  ]},

  { no:"第五单元", name:"建设法治中国", color:4, lessons:[
    { name:"第十三课 坚持全面依法治国", points:[
      "科学立法","严格执法","公正司法","全民守法" ]},
    { name:"第十四课 以法治推进国家治理现代化", points:[
      "法治与改革相互促进","法治与德治相得益彰","青少年树立法治信仰" ]}
  ]}
];

/* ================= 渲染 ================= */
const NS = 'http://www.w3.org/2000/svg';
const COLORS = [
  { main:'#c0392b', tint:'#fdecea' },
  { main:'#2e86c1', tint:'#e9f3fb' },
  { main:'#1e8449', tint:'#e9f6ee' },
  { main:'#884ea0', tint:'#f4edf9' },
  { main:'#d35400', tint:'#fdf1e7' }
];
const WIDTH  = { root:112, lesson:176, box:172, point:176 };
const FONT   = { root:14,  lesson:12,  box:11.5, point:10.5 };
const SH     = { lesson:38, box:36, point:28 };   // 单行高
const DH     = { lesson:52, box:50, point:40 };   // 双行高
const HG = 18, VG = 8, LEFT = 12, TOP = 16, RIGHT_PAD = 10, BOTTOM_PAD = 14;

function el(name, attrs){
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function makeNode(text, type){
  return { text, type, lines:[], children:[], x:0, y:0, w:0, h:0, subH:0 };
}

function wrapText(text, fz, maxPx){
  if (text.length * fz <= maxPx) return [text];
  let mid = Math.ceil(text.length / 2);
  while (mid < text.length && '、。，；：·→'.indexOf(text[mid]) >= 0) mid++;
  if (mid >= text.length) mid = Math.ceil(text.length / 2);
  return [text.slice(0, mid), text.slice(mid)];
}

function prep(n){
  let fz, lines;
  if (n.type === 'root') { fz = FONT.root; lines = [n.text[0], n.text[1]]; }
  else { fz = FONT[n.type]; lines = wrapText(n.text, fz, WIDTH[n.type] - 18); }
  n.lines = lines;
  n.w = WIDTH[n.type];
  if (n.type === 'root') n.h = 50;
  else n.h = lines.length > 1 ? DH[n.type] : SH[n.type];
  n.children.forEach(prep);
}

function measure(n){
  if (!n.children.length) { n.subH = n.h; return n.subH; }
  let h = 0;
  n.children.forEach(c => { h += measure(c) + VG; });
  h -= VG;
  n.subH = Math.max(h, n.h);
  return n.subH;
}

function layout(n, x, yTop){
  n.x = x; n.y = yTop + (n.subH - n.h) / 2;
  if (!n.children.length) return;
  let y = yTop;
  n.children.forEach(c => {
    layout(c, x + n.w + HG, y);
    y += c.subH + VG;
  });
}

function collectEdges(n, arr, depth){
  n.children.forEach(c => {
    arr.push({ x1:n.x + n.w, y1:n.y + n.h/2, x2:c.x, y2:c.y + c.h/2, depth });
    collectEdges(c, arr, depth + 1);
  });
}

function curve(e){
  let dx = (e.x2 - e.x1) * 0.5;
  dx = Math.max(16, Math.min(70, dx));
  return 'M' + e.x1.toFixed(1) + ',' + e.y1.toFixed(1)
       + ' C' + (e.x1 + dx).toFixed(1) + ',' + e.y1.toFixed(1)
       + ' ' + (e.x2 - dx).toFixed(1) + ',' + e.y2.toFixed(1)
       + ' ' + e.x2.toFixed(1) + ',' + e.y2.toFixed(1);
}

function extent(n){
  let mx = n.x + n.w, my = n.y + n.subH;
  n.children.forEach(c => {
    const r = extent(c);
    if (r.mx > mx) mx = r.mx;
    if (r.my > my) my = r.my;
  });
  return { mx, my };
}

function renderNode(n, svg, col){
  const g = el('g', { transform:'translate(' + n.x + ',' + n.y + ')' });
  const r = el('rect', {
    x:0, y:0, width:n.w, height:n.h,
    rx: n.type === 'root' ? 12 : 7,
    fill: n.type === 'root' ? col.main : (n.type === 'point' ? col.tint : '#fff'),
    stroke: n.type === 'root' ? 'none' : col.main,
    'stroke-width': n.type === 'lesson' ? 1.8 : (n.type === 'box' ? 1.4 : 1.2)
  });
  g.appendChild(r);

  const t = el('text', { x:9, fill: n.type === 'root' ? '#fff' : '#20212e' });
  if (n.type === 'root') {
    const l1 = el('tspan', { x:9, y:20, 'font-size':10.5, opacity:0.85 });
    l1.textContent = n.lines[0];
    const l2 = el('tspan', { x:9, y:36, 'font-size':14, 'font-weight':800 });
    l2.textContent = n.lines[1];
    t.appendChild(l1); t.appendChild(l2);
  } else if (n.lines.length === 1) {
    const fz = FONT[n.type];
    const s = el('tspan', { x:9, y:n.h/2 + fz*0.36, 'font-size':fz, 'font-weight': n.type === 'point' ? 400 : 600 });
    s.textContent = n.lines[0];
    t.appendChild(s);
  } else {
    const fz = FONT[n.type];
    n.lines.forEach((ln, i) => {
      const s = el('tspan', { x:9, y: n.h/2 + (i === 0 ? -3.5 : 13), 'font-size':fz, 'font-weight': n.type === 'point' ? 400 : 600 });
      s.textContent = ln;
      t.appendChild(s);
    });
  }
  g.appendChild(t);
  svg.appendChild(g);
}

function renderPage(u, svg){
  const col = COLORS[u.color];
  const root = makeNode([u.no, u.name], 'root');
  u.lessons.forEach(l => {
    const ln = makeNode(l.name, 'lesson');
    if (l.boxes) l.boxes.forEach(b => {
      const bn = makeNode(b.name, 'box');
      b.points.forEach(p => bn.children.push(makeNode(p, 'point')));
      ln.children.push(bn);
    });
    if (l.points) l.points.forEach(p => ln.children.push(makeNode(p, 'point')));
    root.children.push(ln);
  });

  prep(root);
  measure(root);
  layout(root, LEFT, TOP);

  const ext = extent(root);
  const W = ext.mx + RIGHT_PAD, H = ext.my + BOTTOM_PAD;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  const edges = [];
  collectEdges(root, edges, 0);
  edges.forEach(e => {
    const p = el('path', {
      d: curve(e), fill:'none',
      stroke: col.main,
      'stroke-width': e.depth === 0 ? 2.2 : 1.6,
      'stroke-linecap':'round', 'stroke-linejoin':'round'
    });
    svg.appendChild(p);
  });

  (function walk(n){
    renderNode(n, svg, col);
    n.children.forEach(walk);
  })(root);
}

UNITS.forEach((u, i) => renderPage(u, document.getElementById('mm' + i)));
</script>
</body>
</html>
