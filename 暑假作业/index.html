<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑假作业 · 全科导航</title>
<style>
  :root {
    --ink: #23283a;
    --paper: #f6f4ef;
    --card: #ffffff;
    --line: #e3ded2;
    --muted: #8a8474;
    --c-yuwen: #c0392b;
    --c-shuxue: #2563a8;
    --c-yingyu: #2e7d4f;
    --c-daofa: #7a4da0;
    --c-tiyu: #d97706;
    --c-deyu: #9a7b2f;
    --c-mingzhu: #4a5a6a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--paper); color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  /* 顶栏 */
  .masthead {
    background: var(--ink); color: #f2efe6;
    padding: 16px 16px 0;
    position: relative; z-index: 20;
  }
  .masthead .title-row { display: flex; align-items: center; gap: 12px; }
  .masthead .title { flex: 1; min-width: 0; }
  .masthead h1 { font-size: 19px; letter-spacing: .08em; font-weight: 800; }
  .masthead .sub { font-size: 11px; color: #b8b2a0; margin-top: 3px; }
  /* 科目胶囊（横滑） */
  .subject-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 14px 0 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .subject-bar::-webkit-scrollbar { display: none; }
  .subject-chip {
    flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
    color: #d8d4c6; background: transparent;
    padding: 7px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit; white-space: nowrap; transition: all .15s;
  }
  .subject-chip:hover { background: rgba(255,255,255,.08); }
  .subject-chip.active {
    background: var(--chip, #fff); border-color: var(--chip, #fff);
    color: var(--ink); font-weight: 700;
  }
  /* 主体 */
  .layout { display: block; }
  .sidebar {
    display: none;
    width: 220px; background: #fff;
    border-right: 1px solid var(--line);
    padding: 16px 0; position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  .sidebar .side-group { margin-bottom: 14px; }
  .sidebar .side-head { font-size: 11px; letter-spacing: .18em; color: var(--muted); padding: 4px 18px 6px; }
  .sidebar .side-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left; border: none; background: none;
    padding: 8px 18px; font-size: 13.5px; cursor: pointer; color: var(--ink);
    font-family: inherit; border-left: 3px solid transparent;
  }
  .sidebar .side-item:hover { background: #f6f4ef; }
  .sidebar .side-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--c-yuwen)); flex-shrink: 0; }
  .sidebar .side-item .tag { margin-left: auto; font-size: 10px; color: var(--muted); }
  .content { padding: 16px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 780px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; position: relative;
    display: flex; flex-direction: column; gap: 6px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 1px 3px rgba(35,40,58,.05);
    text-decoration: none; color: inherit;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(35,40,58,.1); }
  .card::before {
    content:""; position:absolute; left:0; top:14px; bottom:14px;
    width: 5px; border-radius: 0 3px 3px 0;
    background: var(--c, var(--c-yuwen));
  }
  .card .c-title { font-size: 16px; font-weight: 700; padding-left: 6px; }
  .card .c-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding-left: 6px; }
  .card .c-meta { display: flex; gap: 8px; align-items: center; padding-left: 6px; margin-top: 4px; }
  .pill { font-size: 10.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.must { background: #fdecec; border-color: #f3c6c6; color: #a84545; font-weight: 600; }
  .pill.opt  { background: #f2f6f0; border-color: #d4e3d6; color: #4e7a56; }
  .card .arrow { margin-left: auto; color: #c9c2b2; font-size: 18px; padding-right: 4px; }
  .empty-tip { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 16px; }
  .usage-note {
    max-width: 780px; margin: 0 auto 14px; font-size: 12px; color: var(--muted);
    background: #fff8ea; border: 1px solid #eeddb8; border-radius: 10px;
    padding: 10px 14px; line-height: 1.7;
  }
  @media (min-width: 900px) {
    .layout { display: flex; align-items: flex-start; }
    .sidebar { display: block; }
    .subject-bar { display: none; }
    .content { flex: 1; padding: 28px 32px; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); max-width: 1100px; }
    .usage-note { max-width: 1100px; margin: 0 auto 16px; }
  }
  footer { text-align:center; font-size: 11px; color: #b0a896; padding: 20px 16px 30px; }
</style>
</head>
<body>

<div class="masthead">
  <div class="title-row">
    <div class="title">
      <h1>暑假作业</h1>
      <div class="sub">全科导航 · 点击打开对应作业（浏览器可直接打印）</div>
    </div>
  </div>
  <nav class="subject-bar" id="subjectBar"></nav>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div class="usage-note" id="usageNote">
      💡 <b>使用说明：</b>点下方任意作业卡片，会在新页面打开对应作业内容；返回本导航页即可切换其他作业。各页面支持 A4 打印（Ctrl+P）。
    </div>
    <div class="cards" id="cards"></div>
    <div class="empty-tip" id="emptyTip" style="display:none">该科目下暂无作业</div>
  </main>
</div>

<footer>暑假作业 · 初二年级 · 2026</footer>

<script>
const SUBJECTS = [
  { key:'yuwen', name:'语文', color:'var(--c-yuwen)', items:[
    { title:'背默篇目清单', file:'语文/背默篇目清单.html', must:true, desc:'七上~九上全部背默篇目 · 附原文 · 已背勾选' },
    { title:'生活记录写作 · 7月篇', file:'语文/生活记录写作-7月篇.html', must:true, desc:'暑假在家 + 同游日本（东京/大阪）· 约600字' },
    { title:'生活记录写作 · 8月篇', file:'语文/生活记录写作-8月篇.html', must:true, desc:'老家浏阳20天：数学补习 · 浏阳河 · 西湖山 · 约620字' },
    { title:'观影记录卡（3部）', file:'语文/观影记录卡.html', must:true, desc:'《当幸福来敲门》《摔跤吧！爸爸》《寻梦环游记》' },
    { title:'练字帖（选做）', file:'语文/选做-练字帖.html', must:false, desc:'3页田字格 · 15个规范汉字 · 描红+临写' },
    { title:'阅读记录（选做）', file:'语文/选做-阅读记录.html', must:false, desc:'推荐书单 + 阅读计划表 + 读书笔记模板' }
  ]},
  { key:'mingzhu', name:'名著速读', color:'var(--c-mingzhu)', items:[
    { title:'《简·爱》逐章梗概', file:'语文/简爱逐章梗概.html', must:true, desc:'38章详细梗概 · 人物表 · 经典名句 · 中考考点' }
  ]},
  { key:'shuxue', name:'数学', color:'var(--c-shuxue)', items:[
    { title:'知识点梳理 · 按章节', file:'数学/知识点梳理-按章节.html', must:true, desc:'四学期24章 · 每章知识点+公式+2道例题' },
    { title:'知识点梳理 · 按知识主线', file:'数学/知识点梳理-按知识主线.html', must:true, desc:'四大模块23讲 · 156条公式 · 知识脉络' },
    { title:'小小理财家（选做）', file:'数学/选做-小小理财家.html', must:false, desc:'收支记账表 + 旅游支出示例 + 统计图表' },
    { title:'小小建筑师（选做）', file:'数学/选做-小小建筑师.html', must:false, desc:'房间测量 + 平面图网格纸 + 屏幕尺寸勾股计算' }
  ]},
  { key:'yingyu', name:'英语', color:'var(--c-yingyu)', items:[
    { title:'英语作文集（7篇）', file:'英语/作文集.html', must:true, desc:'封面+7篇80-150词范文 · 对应八下8单元话题' },
    { title:'听说练习打卡表', file:'英语/听说练习打卡表.html', must:true, desc:'8/15-8/31 练习记录 + 每周小结 + 素材推荐' },
    { title:'英文小说读书笔记（选做）', file:'英语/选做-英文小说读书笔记.html', must:false, desc:'书虫二三级书目 + 词汇积累卡 + 笔记模板' }
  ]},
  { key:'daofa', name:'道德与法治', color:'var(--c-daofa)', items:[
    { title:'五单元思维导图 · 节点连线版', file:'道法/思维导图-节点连线版.html', must:true, desc:'节点+曲线连接 · 可折叠缩放 · 宪法→法治中国' },
    { title:'思维导图 · 每单元一页', file:'道法/思维导图-每单元一页.html', must:true, desc:'5张A4 · 每单元独立成页，打印即交' },
    { title:'法治手抄报（选做）', file:'道法/选做-法治手抄报.html', must:false, desc:'A4手抄报版式 · 5大板块 · 含插图位' }
  ]},
  { key:'tiyu', name:'体育', color:'var(--c-tiyu)', items:[
    { title:'体育打卡记录表', file:'体育/打卡记录表.html', must:true, desc:'8/15-8/31 跑步/武术/蛙跳/跳绳 每日记录' }
  ]},
  { key:'deyu', name:'年级德育', color:'var(--c-deyu)', items:[
    { title:'德育 PPT · 我心中的奥运冠军', file:'德育PPT/我心中的奥运冠军-潘展乐.html', must:true, desc:'潘展乐 · 12页演示 · 键盘翻页 · 含演讲词备注' }
  ]}
];

let currentKey = 'yuwen';
const bar = document.getElementById('subjectBar');
const side = document.getElementById('sidebar');
const cards = document.getElementById('cards');

function renderSubjects() {
  bar.innerHTML = ''; side.innerHTML = '';
  SUBJECTS.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'subject-chip' + (s.key === currentKey ? ' active' : '');
    chip.textContent = s.name;
    chip.style.setProperty('--chip', s.color);
    chip.onclick = () => { currentKey = s.key; renderSubjects(); };
    bar.appendChild(chip);

    const grp = document.createElement('div');
    grp.className = 'side-group';
    grp.innerHTML = '<div class="side-head">' + s.name + '</div>';
    s.items.forEach(item => {
      const a = document.createElement('a');
      a.className = 'side-item';
      a.href = item.file;
      a.target = '_blank';
      a.style.setProperty('--c', s.color);
      a.innerHTML = '<span class="dot"></span><span>' + item.title + '</span>' +
        (item.must ? '<span class="tag">必做</span>' : '<span class="tag">选做</span>');
      grp.appendChild(a);
    });
    side.appendChild(grp);
  });
  renderCards();
}

function renderCards() {
  const s = SUBJECTS.find(x => x.key === currentKey);
  cards.innerHTML = '';
  if (!s) return;
  s.items.forEach(item => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = item.file;
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.setProperty('--c', s.color);
    a.innerHTML =
      '<div class="c-title">' + item.title + '</div>' +
      '<div class="c-desc">' + item.desc + '</div>' +
      '<div class="c-meta"><span class="pill ' + (item.must ? 'must' : 'opt') + '">' +
      (item.must ? '必做' : '选做') + '</span><span class="arrow">›</span></div>';
    cards.appendChild(a);
  });
  document.getElementById('emptyTip').style.display = s.items.length ? 'none' : 'block';
}

renderSubjects();
</script>
</body>
</html>
