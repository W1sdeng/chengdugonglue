<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暑假作业 · 全科导航</title>
<style>
  :root {
    --ink: #23283a; --paper: #f6f4ef; --card: #ffffff; --line: #e3ded2; --muted: #8a8474;
    --c-yuwen: #c0392b; --c-shuxue: #2563a8; --c-yingyu: #2e7d4f; --c-daofa: #7a4da0;
    --c-tiyu: #d97706; --c-deyu: #9a7b2f; --c-mingzhu: #4a5a6a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--paper); color: var(--ink); -webkit-text-size-adjust: 100%;
  }
  .masthead { background: var(--ink); color: #f2efe6; padding: 14px 16px 12px; position: relative; z-index: 20; display: flex; align-items: center; gap: 12px; }
  .masthead .title { flex: 1; min-width: 0; }
  .masthead h1 { font-size: 18px; letter-spacing: .06em; font-weight: 800; }
  .masthead .sub { font-size: 11px; color: #b8b2a0; margin-top: 2px; }
  .masthead .btn-back { display: none; background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .masthead.show-back .btn-back { display: inline-block; }
  .subject-bar { background: var(--ink); padding: 0 8px 12px; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; position: sticky; top: 0; z-index: 15; scrollbar-width: none; }
  .subject-bar::-webkit-scrollbar { display: none; }
  .subject-chip { flex: 0 0 auto; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; color: #d8d4c6; background: transparent; padding: 7px 16px; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all .15s; }
  .subject-chip:hover { background: rgba(255,255,255,.08); }
  .subject-chip.active { background: var(--chip, #fff); border-color: var(--chip, #fff); color: var(--ink); font-weight: 700; }
  .layout { display: block; }
  .sidebar { display: none; width: 220px; background: #fff; border-right: 1px solid var(--line); padding: 16px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .sidebar .side-group { margin-bottom: 14px; }
  .sidebar .side-head { font-size: 11px; letter-spacing: .18em; color: var(--muted); padding: 4px 18px 6px; }
  .sidebar .side-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none; padding: 8px 18px; font-size: 13.5px; cursor: pointer; color: var(--ink); font-family: inherit; border-left: 3px solid transparent; }
  .sidebar .side-item:hover { background: #f6f4ef; }
  .sidebar .side-item.active { border-left-color: var(--c, var(--c-yuwen)); background: #faf8f3; font-weight: 700; }
  .sidebar .side-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--c-yuwen)); flex-shrink: 0; }
  .sidebar .side-item .tag { margin-left: auto; font-size: 10px; color: var(--muted); }
  .content { padding: 16px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 780px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 6px; transition: transform .12s ease, box-shadow .12s ease; box-shadow: 0 1px 3px rgba(35,40,58,.05); }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(35,40,58,.1); }
  .card::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width: 5px; border-radius: 0 3px 3px 0; background: var(--c, var(--c-yuwen)); }
  .card .c-title { font-size: 16px; font-weight: 700; padding-left: 6px; }
  .card .c-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; padding-left: 6px; }
  .card .c-meta { display: flex; gap: 8px; align-items: center; padding-left: 6px; margin-top: 4px; }
  .pill { font-size: 10.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.must { background: #fdecec; border-color: #f3c6c6; color: #a84545; font-weight: 600; }
  .pill.opt  { background: #f2f6f0; border-color: #d4e3d6; color: #4e7a56; }
  .viewer { display: none; position: fixed; inset: 0; background: #fff; z-index: 30; flex-direction: column; }
  .viewer.show { display: flex; }
  .viewer-head { background: var(--ink); color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .viewer-head .v-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-head button { background: rgba(255,255,255,.14); border: none; color: #fff; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .viewer-head button:hover { background: rgba(255,255,255,.25); }
  .viewer iframe { flex: 1; width: 100%; border: none; background: #fff; }
  @media print { .masthead, .subject-bar, .sidebar, .content, .viewer-head { display: none !important; } .viewer { position: static; display: flex !important; } .viewer iframe { height: 100vh; } }
  @media (min-width: 900px) { .layout { display: flex; align-items: flex-start; } .sidebar { display: block; } .subject-bar { display: none; } .content { flex: 1; padding: 28px 32px; } .cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); max-width: 1100px; } }
  .empty-tip { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 16px; }
</style>
</head>

let currentKey = 'yuwen';
const bar = document.getElementById('subjectBar');
const side = document.getElementById('sidebar');
const cards = document.getElementById('cards');
const viewer = document.getElementById('viewer');
const viewerFrame = document.getElementById('viewerFrame');
const viewerTitle = document.getElementById('viewerTitle');
const masthead = document.getElementById('masthead');
function renderSubjects() {
  bar.innerHTML = ''; side.innerHTML = '';
  SUBJECTS.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'subject-chip' + (s.key === currentKey ? ' active' : '');
    chip.textContent = s.name;
    chip.style.setProperty('--chip', s.color);
    chip.onclick = () => { currentKey = s.key; renderSubjects(); };
    bar.appendChild(chip);
    const grp = document.createElement('div');
    grp.className = 'side-group';
    grp.innerHTML = '<div class="side-head">' + s.name + '</div>';
    s.items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'side-item';
      btn.style.setProperty('--c', s.color);
      btn.innerHTML = '<span class="dot"></span><span>' + item.title + '</span>' + (item.must ? '<span class="tag">必做</span>' : '<span class="tag">选做</span>');
      btn.onclick = () => openViewer(item, s);
      grp.appendChild(btn);
    });
    side.appendChild(grp);
  });
  renderCards();
}
function renderCards() {
  const s = SUBJECTS.find(x => x.key === currentKey);
  cards.innerHTML = '';
  if (!s) return;
  s.items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--c', s.color);
    card.innerHTML = '<div class="c-title">' + item.title + '</div><div class="c-desc">' + item.desc + '</div><div class="c-meta"><span class="pill ' + (item.must ? 'must' : 'opt') + '">' + (item.must ? '必做' : '选做') + '</span></div>';
    card.onclick = () => openViewer(item, s);
    cards.appendChild(card);
  });
  document.getElementById('emptyTip').style.display = s.items.length ? 'none' : 'block';
}
function openViewer(item, s) {
  viewerTitle.textContent = s.name + ' · ' + item.title;
  const b64 = FRAG_DATA[item.data];
  if (!b64) { alert('内容缺失: ' + item.data); return; }
  const html = decodeURIComponent(escape(atob(b64)));
  viewerFrame.srcdoc = html;
  viewer.classList.add('show');
  masthead.classList.add('show-back');
  document.body.style.overflow = 'hidden';
}
function closeViewer() {
  viewer.classList.remove('show');
  masthead.classList.remove('show-back');
  document.body.style.overflow = '';
  viewerFrame.srcdoc = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
renderSubjects();
